name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "contextmesh-backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Build and restart the container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes ubuntu@"$EC2_HOST" 'bash -euo pipefail' <<'REMOTE'
            cd ~/contextmesh
            git fetch origin main
            git reset --hard origin/main
            cd contextmesh-backend
            docker build -t contextmesh-backend .
            docker stop contextmesh 2>/dev/null || true
            docker rm   contextmesh 2>/dev/null || true
            docker run -d \
              --name contextmesh \
              --restart unless-stopped \
              --env-file .env \
              -p 127.0.0.1:8000:8000 \
              contextmesh-backend
            docker image prune -f
          REMOTE

      - name: Wait for the API to come back
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 https://api.contextmesh.live/health | grep -q '"ok"'; then
              echo "healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "API did not report healthy within 100s"
          exit 1

      - name: Confirm docs stayed hidden
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.contextmesh.live/openapi.json)
          if [ "$code" = "200" ]; then
            echo "openapi.json is public — ENABLE_DOCS is set on the server"
            exit 1
          fi
          echo "docs hidden (openapi.json -> $code)"
